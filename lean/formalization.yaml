version: "v0.4"

project:
  name: "Erdős Problem 326: a minimal asymptotic additive basis with a quadratic limit"
  description: >-
    A Lean formalization of an affirmative answer to Erdős Problem 326:
    there exists a minimal asymptotic additive basis of order two whose
    increasing enumeration, divided by the square of its index, converges
    to a nonzero real constant. The proof constructs a basis with limit
    1/10000 using prime-step Cassels bases and stage-by-stage witnesses.
  authors: ["Liang Wan Yiu David"]
  license: "MIT"
  responsible_maintainers: ["Liang Wan Yiu David"]

