fidelity:
  divergences: >-
    The Lean proof refines stage boundaries relative to the manuscript:
    it completes the witness bin before freezing it and replaces deleted
    endpoints within their own bins. The compared theorem uses the cofinite
    pointwise sum predicate, the unfolded order-two predicate in Formal
    Conjectures. The advertised existence statement has no extra hypotheses.

